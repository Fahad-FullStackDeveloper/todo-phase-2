# TodoFlow Docker Compose Configuration
# Phase 1: Setup & Project Initialization
# 
# Services:
# - database: PostgreSQL (Neon-compatible for local development)
# - backend: FastAPI with uvicorn (hot-reload enabled)
# - frontend: Next.js 16.1.6 (hot-reload enabled)
# - redis: Optional caching layer (for future use)
#
# Usage:
#   docker-compose up              # Start all services
#   docker-compose up --build      # Rebuild and start
#   docker-compose down            # Stop all services
#   docker-compose logs -f         # View logs
#   docker-compose exec backend bash    # Access backend container
#   docker-compose exec frontend bash   # Access frontend container

version: '3.8'

services:
  # ===========================================================================
  # Database Service (PostgreSQL - Neon Compatible)
  # ===========================================================================
  database:
    image: postgres:15-alpine
    container_name: todoflow-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-todoflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-todoflow_secret}
      POSTGRES_DB: ${DB_NAME:-todoflow}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - todoflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-todoflow} -d ${DB_NAME:-todoflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Neon-compatible configuration
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c wal_level=replica
      -c max_wal_senders=3
      -c max_replication_slots=3

  # ===========================================================================
  # Backend Service (FastAPI + Uvicorn)
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todoflow-backend
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-todoflow}:${DB_PASSWORD:-todoflow_secret}@database:5432/${DB_NAME:-todoflow}
      # Authentication
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-your-secret-key-min-32-chars-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-7d}
      # Frontend URL for CORS
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000,http://frontend:3000}
      # SQL Debug
      SQL_ECHO: ${SQL_ECHO:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    networks:
      - todoflow-network
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # Frontend Service (Next.js 16.1.6)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=development
    container_name: todoflow-frontend
    restart: unless-stopped
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:-http://localhost:3000}
      NODE_ENV: development
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    networks:
      - todoflow-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================================================
  # Redis Service (Optional - for caching/sessions)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: todoflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - todoflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

# =============================================================================
# Networks
# =============================================================================
networks:
  todoflow-network:
    driver: bridge
    name: todoflow-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    name: todoflow-postgres-data
  backend_venv:
    name: todoflow-backend-venv
  frontend_node_modules:
    name: todoflow-frontend-node-modules
  frontend_next:
    name: todoflow-frontend-next
  redis_data:
    name: todoflow-redis-data
